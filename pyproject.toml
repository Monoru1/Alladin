[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alladin"
version = "0.1.0"
description = "ALLADIN — laboratoire de trading Forex automatisé (MT5 DEMO uniquement)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "cryptography>=43",
    "tzdata>=2024.1",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
alladin = "alladin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["mt5_integration: nécessite un terminal MetaTrader 5 connecté à un compte DEMO (désactivé par défaut)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # E501 : le formateur gère le code ; les messages français longs restent lisibles

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["MetaTrader5", "MetaTrader5.*"]
ignore_missing_imports = true
